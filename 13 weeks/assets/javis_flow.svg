<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <rect width="1100" height="420" fill="#f8fafc"/>
  <text x="50" y="55" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="30" font-weight="700" fill="#0f172a">Javis 처리 흐름</text>
  <text x="52" y="88" font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16" fill="#475569">마이크 녹음부터 STT 변환, CSV 저장, 키워드 검색까지의 전체 흐름입니다.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <g font-family="Arial, 'Malgun Gothic', sans-serif">
    <rect x="55" y="150" width="180" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="145" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#075985">1. 마이크 녹음</text>
    <text x="145" y="218" text-anchor="middle" font-size="14" fill="#0f172a">sounddevice 사용</text>

    <line x1="245" y1="200" x2="315" y2="200" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="325" y="150" width="190" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="420" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">2. WAV 저장</text>
    <text x="420" y="218" text-anchor="middle" font-size="14" fill="#0f172a">records 폴더</text>

    <line x1="525" y1="200" x2="595" y2="200" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="605" y="150" width="190" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="700" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#92400e">3. STT 변환</text>
    <text x="700" y="218" text-anchor="middle" font-size="14" fill="#0f172a">SpeechRecognition</text>

    <line x1="805" y1="200" x2="875" y2="200" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="885" y="150" width="170" height="100" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="970" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#5b21b6">4. CSV 저장</text>
    <text x="970" y="218" text-anchor="middle" font-size="14" fill="#0f172a">utf-8-sig</text>

    <rect x="325" y="300" width="470" height="58" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="560" y="335" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">보너스 기능: CSV 파일 안에서 키워드 검색</text>
    <line x1="970" y1="260" x2="970" y2="330" stroke="#334155" stroke-width="3"/>
    <line x1="970" y1="330" x2="805" y2="330" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
